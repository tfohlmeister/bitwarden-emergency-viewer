name: Demo page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Pages needs a public repository on the free plan. The guard keeps
    # the job from failing every push should the repository ever go private.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/demo-vault.json _site/demo-vault.json
          # The viewer is shipped verbatim. A demo that differs from the file
          # people download would be worse than no demo.
          cp vault.html _site/viewer.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
